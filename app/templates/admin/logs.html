<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logs — FastChannels</title>
  <style>
    html { font-size: 17px; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      min-height: 100vh;
      min-height: 100dvh;
      height: 100dvh;
      overflow: hidden;
    }
    nav { background: var(--surface); padding: 1rem 2rem; display: flex; align-items: center; gap: 2rem; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    nav .version { margin-left: auto; color: var(--text-muted); font-size: 0.75rem; }
    nav h1 { color: var(--accent); font-size: 1.2rem; font-weight: 700; }
    nav a { color: var(--text-soft); text-decoration: none; font-size: 0.9rem; }
    nav a:hover { color: var(--text); }
    nav a.active { color: var(--accent); font-weight: 600; }

    .toolbar {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 0.6rem 1.5rem; display: flex; align-items: center; gap: 1rem;
    }
    .toolbar label { font-size: 0.82rem; color: var(--text-soft); display: flex; align-items: center; gap: 0.4rem; cursor: pointer; }
    .toolbar input[type=checkbox] { accent-color: var(--accent); }
    .btn {
      padding: 0.35rem 0.85rem; border-radius: 6px; font-size: 0.8rem; cursor: pointer;
      border: none; font-weight: 500; background: var(--accent-strong); color: white; transition: background 0.15s;
    }
    .btn:hover { background: var(--accent-strong-hover); }
    .filter-input {
      background: var(--bg); border: 1px solid var(--border); color: var(--text);
      border-radius: 6px; padding: 0.3rem 0.6rem; font-size: 0.8rem; width: 220px;
    }
    .filter-input:focus { outline: none; border-color: var(--accent); }
    .status { font-size: 0.78rem; color: var(--text-muted); margin-left: auto; }

    .level-group { display: flex; gap: 0.35rem; }
    .level-btn {
      padding: 0.3rem 0.7rem; border-radius: 6px; font-size: 0.78rem; cursor: pointer;
      border: 1px solid var(--border); font-weight: 500; background: transparent; color: var(--text-soft);
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .level-btn:hover { color: var(--text); }
    .level-btn.active { background: var(--accent-strong); border-color: var(--accent-strong); color: white; }

    #log-container {
      overflow: auto; padding: 0.75rem 1.5rem;
      font-family: 'SFMono-Regular', 'Consolas', 'Liberation Mono', monospace; font-size: 0.78rem; line-height: 1.55;
      height: 100%;
      min-height: 0;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      touch-action: pan-x pan-y;
    }
    .line { white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; }
    .line-INFO    { color: var(--text-subtle); }
    .line-WARNING { color: var(--warning); }
    .line-ERROR   { color: var(--danger); }
    .line-CRITICAL{ color: var(--danger); font-weight: 700; }
    .line-DEBUG   { color: var(--text-dim); }
    .line-other   { color: var(--text-soft); }
    .line.hidden  { display: none; }
    @media (max-width: 760px) {
      html { font-size: 16px; }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        height: 100dvh;
        overflow: hidden;
      }
      nav { padding: 0.9rem 1rem; gap: 0.75rem 1rem; }
      nav h1 { width: 100%; }
      nav .version { margin-left: 0; width: 100%; order: 99; }
      .toolbar {
        padding: 0.75rem 1rem;
        flex-wrap: wrap;
        align-items: stretch;
        gap: 0.75rem;
      }
      .toolbar label, .toolbar .btn {
        min-height: 2.25rem;
      }
      .toolbar label {
        width: calc(50% - 0.375rem);
      }
      .toolbar .btn {
        width: 100%;
      }
      .level-group {
        width: 100%;
      }
      .level-btn {
        flex: 1;
        min-height: 2.25rem;
      }
      .filter-input { width: 100%; }
      .status { margin-left: 0; width: 100%; }
      #log-container {
        min-height: 0;
        height: 100%;
        overflow: auto;
        -webkit-overflow-scrolling: touch;
        padding: 0.75rem 0.85rem 1.1rem;
        font-size: 0.72rem;
        line-height: 1.45;
      }
      .line {
        padding: 0.12rem 0;
        white-space: pre;
        word-break: normal;
        overflow-wrap: normal;
        min-width: max-content;
      }
    }
  </style>
  {% include 'admin/_theme_head.html' %}
</head>
<body>
  {% set active_page = 'logs' %}
  {% include 'admin/_nav.html' %}

  <div class="toolbar">
    <button class="btn" onclick="refresh()">↺ Refresh</button>
    <label><input type="checkbox" id="auto-refresh" onchange="toggleAuto()"> Auto (5s)</label>
    <label><input type="checkbox" id="tail-mode" checked onchange="applyFilter()"> Tail</label>
    <div class="level-group" id="level-group">
      <button class="level-btn active" data-level="ALL" onclick="setLevel('ALL')">All</button>
      <button class="level-btn" data-level="DEBUG" onclick="setLevel('DEBUG')">Debug</button>
      <button class="level-btn" data-level="INFO" onclick="setLevel('INFO')">Info</button>
      <button class="level-btn" data-level="WARNING" onclick="setLevel('WARNING')">Warning</button>
      <button class="level-btn" data-level="ERROR" onclick="setLevel('ERROR')">Error</button>
      <button class="level-btn" data-level="CRITICAL" onclick="setLevel('CRITICAL')">Critical</button>
    </div>
    <input class="filter-input" id="filter" type="text" placeholder="Filter…" oninput="applyFilter()">
    <span class="status" id="status"></span>
  </div>

  <div id="log-container"></div>

  <script>
    const APP_TIME_ZONE = {{ app_timezone_name|tojson }};
    let _timer = null;
    let _lines = [];
    let _level = 'ALL';

    const LEVEL_RE = /\s+(INFO|WARNING|ERROR|CRITICAL|DEBUG)\s+/;

    function lineLevel(line) {
      const m = line.match(LEVEL_RE);
      return m ? m[1] : null;
    }

    function levelClass(line) {
      const lvl = lineLevel(line);
      return lvl ? 'line-' + lvl : 'line-other';
    }

    function setLevel(level) {
      _level = level;
      document.querySelectorAll('#level-group .level-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.level === level);
      });
      applyFilter();
    }

    async function refresh() {
      const status = document.getElementById('status');
      status.textContent = 'Loading…';
      try {
        const r = await fetch('/api/logs?n=2500');
        const data = await r.json();
        _lines = data.lines;
        applyFilter();
        status.textContent = `${_lines.length} lines · ${new Date().toLocaleTimeString([], { timeZone: APP_TIME_ZONE, timeZoneName: 'short' })}`;
      } catch(e) {
        status.textContent = 'Error: ' + e.message;
      }
    }

    function applyFilter() {
      const query = document.getElementById('filter').value.toLowerCase();
      const tail  = document.getElementById('tail-mode').checked;
      const container = document.getElementById('log-container');

      container.innerHTML = '';
      const frag = document.createDocumentFragment();
      for (const line of _lines) {
        const div = document.createElement('div');
        div.className = 'line ' + levelClass(line);
        div.textContent = line.trimEnd();
        if (query && !line.toLowerCase().includes(query)) div.classList.add('hidden');
        if (_level !== 'ALL' && lineLevel(line) !== _level) div.classList.add('hidden');
        frag.appendChild(div);
      }
      container.appendChild(frag);

      if (tail) container.scrollTop = container.scrollHeight;
    }

    function toggleAuto() {
      if (document.getElementById('auto-refresh').checked) {
        _timer = setInterval(refresh, 5000);
      } else {
        clearInterval(_timer);
        _timer = null;
      }
    }

    refresh();
  </script>
  <script src="{{ url_for('static', filename='js/admin_theme.js') }}"></script>
  {% include 'admin/_update_modal.html' %}
</body>
</html>
