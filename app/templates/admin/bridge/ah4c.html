<!-- ah4c Capture (multi-tuner) card -->
<div class="source-card bridge-panel-card" id="bridge-card-ah4c">
  <div class="source-body open">
    <div class="fields-grid" style="max-width:480px;margin-top:12px">
      <div class="field field-full">
        <label for="fc-player-ah4c-url">ah4c server URL</label>
        <input type="text" id="fc-player-ah4c-url" placeholder="http://192.168.1.30:7654" value="{{ fc_player_ah4c_url }}">
        <div class="help">Where ah4c is running.</div>
      </div>
    </div>
    <div id="ah4c-tuners-result" class="ah4c-tuners" hidden></div>
    <div class="field-actions">
      <button class="btn btn-secondary" onclick="openAh4cConnectModal()">Set up ah4c for me</button>
      <button class="btn btn-secondary" style="margin-right:auto" onclick="checkAh4cTuners()">Check tuner authorization(s)</button>
      <span class="save-status" id="fc-player-ah4c-status"></span>
      <button class="btn btn-secondary" onclick="openAh4cScriptsModal()">Update ah4c scripts</button>
      <button class="btn btn-primary" onclick="saveFcPlayerAh4cSettings()">Save</button>
    </div>
    <div class="help" style="margin-top:8px">After updating FastChannels, click <strong>Update ah4c scripts</strong>.</div>
    <div class="ah4c-activity">
      <div class="fc-devices-toolbar">
        <div class="toggle-row-label">ah4c activity <span class="help" id="ah4c-activity-summary">Checking…</span></div>
        <div class="fc-devices-toolbar-actions">
          <a class="btn btn-secondary" id="ah4c-activity-link" target="_blank" rel="noopener noreferrer" hidden>Open ah4c dashboard</a>
          <button class="btn btn-secondary" onclick="loadAh4cActivity()">Refresh</button>
        </div>
      </div>
      <div class="fc-devices-grid" id="ah4c-activity-list" aria-live="polite"></div>
    </div>
    <details class="bridge-fallback-details">
      <summary>Older ah4c scripts</summary>
      <div class="help">ah4c normally names the device for each tune (<code>TUNERn_IP</code>). Older scripts that don't fall back to the device IP set under <a href="#bridge-card-single-encoder">Single-port HDMI Capture</a>.</div>
    </details>
  </div>
</div>
