      <div class="toggle-row">
        <div class="toggle-row-text">
          <div class="toggle-row-label">Cache channel logos &amp; guide artwork</div>
          <div class="toggle-row-help">Serve cached images through FastChannels for reliable delivery. When off, image URLs point to the provider. Some sources, including Roku, need proxying for artwork to display correctly.</div>
        </div>
        <div class="toggle-row-control">
          <span class="settings-autosave">Auto-saves</span>
          <label class="toggle-switch">
            <input type="checkbox" id="image-proxy-enabled" {% if image_proxy_enabled %}checked{% endif %}
                   onchange="saveSettings({image_proxy_enabled: this.checked}, 'image-proxy-status')">
            <span class="toggle-slider"></span>
          </label>
          <span class="save-status" id="image-proxy-status"></span>
        </div>
      </div>
