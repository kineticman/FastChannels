  <!-- PrismCast (DRM bridge) card -->
  <div class="source-card bridge-panel-card" id="bridge-card-prismcast">
    <div class="source-body open">
      <div class="fields-grid" style="max-width:480px">
        <div class="field field-full">
          <label for="prismcast-url">PrismCast server URL</label>
          <input type="text" id="prismcast-url"
                 placeholder="http://192.168.1.50:5589" value="{{ prismcast_url }}">
          <div class="help">Usually port <code>5589</code>. The PrismCast playlists are on <a href="/admin/feeds">Feeds</a>.</div>
        </div>
        <div class="field field-full">
          <label for="prismcast-inner-url">Address PrismCast uses to reach FastChannels <span style="color:var(--text-muted);font-weight:400">(optional)</span></label>
          <input type="text" id="prismcast-inner-url"
                 placeholder="defaults to FastChannels Server URL" value="{{ prismcast_inner_url }}">
          <div class="help">DRM only plays over HTTPS or <code>http://127.0.0.1</code>. If PrismCast runs on this same machine, use <code>http://127.0.0.1:5523</code>; otherwise an HTTPS address. Leave blank to use the Server URL.</div>
        </div>
        <div class="field field-full">
          <label for="prismcast-max-height">Maximum resolution</label>
          <select id="prismcast-max-height">
            <option value="0" {% if prismcast_max_height == 0 %}selected{% endif %}>Auto</option>
            <option value="1080" {% if prismcast_max_height == 1080 %}selected{% endif %}>1080p</option>
            <option value="720" {% if prismcast_max_height == 720 %}selected{% endif %}>720p</option>
            <option value="480" {% if prismcast_max_height == 480 %}selected{% endif %}>480p</option>
            <option value="360" {% if prismcast_max_height == 360 %}selected{% endif %}>360p</option>
          </select>
          <div class="help">Lower it if channels black out or buffer on a slower server.</div>
        </div>
      </div>
      <div class="field-actions">
        <span class="save-status" id="prismcast-status"></span>
        <button class="btn btn-secondary" onclick="testPrismcast()">Test setup</button>
        <button class="btn btn-primary" onclick="savePrismcastSettings()">Save</button>
      </div>
    </div>
  </div>
