      <div class="toggle-row">
        <div class="toggle-row-text">
          <div class="toggle-row-label">Auto-allow new channels into feeds</div>
          <div class="toggle-row-help">Add newly discovered channels to feeds automatically. When off, channels wait for approval in <a href="/admin/channels?review=pending">Channels → Needs review</a>.</div>
        </div>
        <div class="toggle-row-control">
          <span class="settings-autosave">Auto-saves</span>
          <label class="toggle-switch">
            <input type="checkbox" id="auto-allow-new-channels" {% if auto_allow_new_channels %}checked{% endif %}
                   onchange="saveSettings({auto_allow_new_channels: this.checked}, 'auto-allow-status')">
            <span class="toggle-slider"></span>
          </label>
          <span class="save-status" id="auto-allow-status"></span>
        </div>
      </div>
