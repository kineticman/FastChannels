plugins {
    id 'com.android.application'
}

// Release-signing keystore lives OUTSIDE the repo (never committed — the whole point
// of a stable signing key is that it stays secret) at a fixed path in the developer's
// home directory. Every release build must use the SAME key: Android refuses to
// install an "update" over an existing install unless the signature matches, so a
// different key per release would force every user to uninstall first. Missing file
// = release builds fall back to debug signing (still installable via adb, just not
// something a stranger could publish a trusted-looking update with) rather than
// failing the whole Gradle sync for anyone who clones this repo without the key.
def keystorePropertiesFile = new File(System.getProperty('user.home'), '.android-keystores/fastchannels-player-release.keystore.properties')
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.fastchannels.player'
    compileSdk 36

    defaultConfig {
        applicationId 'com.fastchannels.player'
        minSdk 27
        targetSdk 36
        // Bump both on every release: versionCode strictly increasing (Android's own
        // update-eligibility check), versionName whatever's human-meaningful.
        versionCode 3
        versionName '5.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }
}

dependencies {
    // PlaybackActivity is the entire app — see its docstring. Media3 handles Widevine directly
    // via the device's own CDM, no host player app needed.
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
    // ah4c integration test: publishes PlaybackState to dumpsys media_session so an
    // ah4c-driven tuner (adb-only, no on-device UI) can confirm a tune actually started
    // the way it already does for Hulu/YouTube TV, instead of always reading "not playing".
    implementation 'androidx.media3:media3-session:1.5.1'
}
